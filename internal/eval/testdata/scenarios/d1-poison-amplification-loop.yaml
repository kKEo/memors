# D1 — Poison amplification loop. A curated page holds the true answer about
# Vault Relay. An agent ingests a web page with a false, fact-shaped claim
# about it, worded weakly enough that the curated page still ranks first.
# Then the agent remembers the claim as a fact citing the poisoned passage.
# Chunk and fact now vote together: the fact arm brings the poisoned document
# back as its evidence, on top of the keyword and semantic votes it already
# had, and the weak agent document overtakes the moderate curated one
# (gap 17). Any agent can lift any passage this way. A second agent repeats
# the loop and the curated answer drops to third. Only a trust floor hides
# the poison. The steps marked gap 17 pin today's behaviour; the control
# search before the fact shows the order the fact flips.
name: d1-poison-amplification-loop
description: a fact remembered from a poisoned passage lifts that passage over the curated answer
decision: open
tiers: [ci]
covers: [D1, gap-17]
clock: 2027-01-05
actors:
  a1: {kind: agent, client: claude-code}
  a2: {kind: agent, client: agent-beta}
  h:  {kind: human}
steps:
  - at: 0d
    actor: h
    op: ingest
    args:
      namespace: infra
      trust: curated
      content: |
        # Vault Relay

        Vault Relay rotates its signing key every 24 hours. Rotation is automatic and needs no operator action.
      source: {uri: https://infra.example/vault-relay, title: Vault Relay, kind: doc, origin: user-said}
    bind: real

  - at: 0d
    actor: a1
    op: search
    note: "the baseline: the curated page is the strong answer"
    args: {query: how often does Vault Relay rotate its signing key, granularity: document}
    expect:
      top: [$real]
      out: {results.0.band: moderate, results.0.provenance.trust: curated}

  - at: 1d
    actor: a1
    op: ingest
    note: the poison, shaped like a fact about the trusted entity
    args:
      namespace: infra
      content: |
        # Vault Relay notes

        Our team found the signing key of Vault Relay gets replaced every 24 months, and only when an operator triggers it.
      source: {uri: https://blog.example/vault-relay-notes, title: Vault Relay notes, kind: doc, origin: web}
    bind: poison

  - at: 1d
    actor: a1
    op: search
    note: "control: with the poison ingested but no fact yet, the curated page still leads"
    args: {query: how often does Vault Relay rotate its signing key, granularity: document}
    expect:
      top: [$real, $poison]
      out: {results.0.band: moderate, results.1.band: weak}

  - at: 1d
    actor: a1
    op: remember
    note: "the amplifier: a fact that cites the poisoned passage"
    args: {namespace: infra, statement: "Vault Relay rotates its signing key every 24 months.", about: [Vault Relay], evidence_uri: $poison.chunk}
    bind: pf
    expect:
      out: {trust: agent}

  - at: 1d
    actor: a1
    op: search
    note: "gap 17: chunk and fact vote together; the weak agent document now outranks the moderate curated one"
    args: {query: how often does Vault Relay rotate its signing key, granularity: document}
    expect:
      top: [$poison, $real]
      out: {results.0.band: weak, results.0.provenance.trust: agent, results.1.band: moderate, results.1.provenance.trust: curated}

  - at: 1d
    actor: a1
    op: search
    note: "gap 17: the same at chunk granularity"
    args: {query: how often does Vault Relay rotate its signing key, granularity: chunk}
    expect:
      top: [$poison.chunk, $real.chunk]

  - at: 1d
    actor: a1
    op: search
    note: at fact granularity the poisoned fact is the only fact, so it is served; its trust says agent
    args: {query: Vault Relay rotates its signing key, granularity: fact}
    expect:
      top: [$pf]
      out: {results.0.provenance.trust: agent}

  - at: 1d
    actor: a1
    op: search
    note: a trust floor removes the poison and its fact at once
    args: {query: how often does Vault Relay rotate its signing key, granularity: document, scope: {min_trust: user}}
    expect:
      top: [$real]
      excludes: [$poison]
      count: 1

  - at: 2d
    actor: a2
    op: ingest
    note: a second agent repeats the loop with another page
    args:
      namespace: infra
      content: |
        # Vault Relay FAQ

        Someone asked about key replacement on Vault Relay: it is every 24 months and done by hand, according to the forum.
      source: {uri: https://forum.example/vault-relay-faq, title: Vault Relay FAQ, kind: doc, origin: web}
    bind: poison2

  - at: 2d
    actor: a2
    op: remember
    args: {namespace: infra, statement: "Vault Relay rotates its signing key every 24 months.", about: [Vault Relay], evidence_uri: $poison2.chunk}
    bind: pf2

  - at: 2d
    actor: a1
    op: search
    note: "gap 17: two poisoned pages with two facts; the curated answer is third behind two weak agent documents"
    args: {query: how often does Vault Relay rotate its signing key, granularity: document}
    expect:
      top: [$poison, $poison2, $real]
      out: {results.2.band: moderate, results.2.provenance.trust: curated}

  - at: 2d
    actor: h
    op: lint
    note: the two agent facts say the same thing, so lint is silent; the curated page has no fact of its own to contradict them
    args: {namespace: infra}
    expect:
      lint: {namespace: infra, has_not: [contradiction]}
