<svg xmlns="http://www.w3.org/2000/svg" width="760" height="421" viewBox="0 0 760 421" role="img" aria-labelledby="t d">
<title id="t">What runs where</title>
<desc id="d">Four workflows. Every pull request (ci.yml, blocks the merge): gofmt, vet and golangci-lint; go test ./... under the race detector on Linux and macOS, which includes the package tests, the contract goldens, the retrieval benchmark, the ci-tier scenarios and the generated-docs check; a pure-Go build and smoke run; a release dry run producing five archives; and the tray tests, end-to-end run and app bundle. Every night (nightly.yml, report only): memors-mcp eval comparing the hash embedder with granite-small-r2 on both corpora, uploaded as a markdown report; nightly- and binary-tier scenarios are planned. Every tag (release.yml, blocks the release): go test, GoReleaser archives, the MCP registry publish, tray tests and the app bundle. Docs changes (docs.yml, blocks the deploy): docs-check.sh checks links and that env vars, commands and metrics are documented, then mdBook builds the three guides for GitHub Pages. No blocking job downloads a model: tests use the hash embedder, a fake clock and temporary directories.</desc>
