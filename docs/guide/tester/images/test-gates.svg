<rect class="bg" x="0.5" y="0.5" width="759" height="420" rx="10"/>
<text x="16" y="30" class="h lg">What runs where</text>
<text x="16" y="48" class="s t2">Four workflows in .github/workflows/. Only the pull-request gate decides whether a change can merge.</text>
<rect class="box" x="16.5" y="64.5" width="172" height="277" rx="8"/>
<rect class="green" x="16.5" y="64.5" width="172" height="66" rx="8"/>
<text x="28" y="84" class="cap tg">EVERY PULL REQUEST</text>
<text x="28" y="102" class="s mono t2">ci.yml</text>
<text x="28" y="119" class="xs h tg">blocks the merge</text>
<text x="28" y="150" class="s">gofmt · vet · golangci-lint</text>
<text x="28" y="167" class="s h">go test ./... -race</text>
<text x="28" y="184" class="s">on Linux and macOS:</text>
<text x="28" y="201" class="s t2">· package tests</text>
<text x="28" y="218" class="s t2">· contract goldens</text>
<text x="28" y="235" class="s t2">· retrieval benchmark</text>
<text x="28" y="252" class="s t2">· ci-tier scenarios</text>
<text x="28" y="269" class="s t2">· generated-docs check</text>
<text x="28" y="286" class="s">pure-Go build + smoke run</text>
<text x="28" y="303" class="s">release dry run: 5 archives</text>
<text x="28" y="320" class="s">tray: tests, E2E, app</text>
<rect class="box" x="201.5" y="64.5" width="172" height="277" rx="8"/>
<rect class="blue" x="201.5" y="64.5" width="172" height="66" rx="8"/>
<text x="213" y="84" class="cap tb">EVERY NIGHT</text>
<text x="213" y="102" class="s mono t2">nightly.yml</text>
<text x="213" y="119" class="xs h tb">report only</text>
<text x="213" y="150" class="s h">memors-mcp eval</text>
<text x="213" y="167" class="s">hash vs granite-small-r2</text>
<text x="213" y="184" class="s">both corpora</text>
<text x="213" y="201" class="s">markdown report artifact</text>
<text x="213" y="235" class="s t3">planned:</text>
<text x="213" y="252" class="s t2">· nightly-tier scenarios</text>
<text x="213" y="269" class="s t2">· binary-tier scenarios</text>
<rect class="box" x="386.5" y="64.5" width="172" height="277" rx="8"/>
<rect class="clay" x="386.5" y="64.5" width="172" height="66" rx="8"/>
<text x="398" y="84" class="cap tc">EVERY TAG</text>
<text x="398" y="102" class="s mono t2">release.yml</text>
<text x="398" y="119" class="xs h tc">blocks the release</text>
<text x="398" y="150" class="s h">go test ./...</text>
<text x="398" y="167" class="s">GoReleaser archives</text>
<text x="398" y="184" class="s">MCP registry publish</text>
<text x="398" y="201" class="s">tray tests</text>
<text x="398" y="218" class="s">tray app bundle</text>
<rect class="box" x="571.5" y="64.5" width="172" height="277" rx="8"/>
<rect class="gray" x="571.5" y="64.5" width="172" height="66" rx="8"/>
<text x="583" y="84" class="cap t2">DOCS CHANGES</text>
<text x="583" y="102" class="s mono t2">docs.yml</text>
<text x="583" y="119" class="xs h t2">blocks the deploy</text>
<text x="583" y="150" class="s h">scripts/docs-check.sh</text>
<text x="583" y="167" class="s t2">· relative links</text>
<text x="583" y="184" class="s t2">· env vars documented</text>
<text x="583" y="201" class="s t2">· commands documented</text>
<text x="583" y="218" class="s t2">· metrics documented</text>
<text x="583" y="235" class="s">mdBook: three guides</text>
<text x="583" y="252" class="s">GitHub Pages</text>
<rect class="gray" x="16.5" y="357.5" width="727" height="52" rx="6"/>
<text x="28" y="378" class="s t2">No blocking job downloads a model. Tests use the <tspan class="h">hash embedder</tspan>, a <tspan class="h">fake clock</tspan></text>
<text x="28" y="396" class="s t2">and <tspan class="h">temporary directories</tspan>, so a run on a laptop gives the same answer as CI.</text>
</svg>
